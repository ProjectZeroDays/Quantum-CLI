name: Android APK Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to publish

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_HOME
      # set, licenses accepted) — android-actions/setup-android fails now
      # that the legacy 'tools' package is gone from the SDK repository.
      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew
      - name: Unit tests
        run: |
          cd android
          ./gradlew --no-daemon testFullDebugUnitTest
      - name: Build full (root) APK
        run: |
          cd android
          ./gradlew --no-daemon assembleFullRelease
      - name: Build limited (no-root) APK
        run: |
          cd android
          ./gradlew --no-daemon assembleLimitedRelease
      - name: Collect APK artifacts
        run: |
          mkdir -p release
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release/ \;
      - name: Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          name: "QUANTUM-CLI ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/*.apk
